server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|mjs|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        audio/mpeg mp3;
        audio/wav wav;
        audio/ogg ogg;
        font/woff2 woff2;
    }
}
